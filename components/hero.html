<!--
  COMPONENT: hero.html
  Purpose: Full-width hero with headline, tagline, state map badge
  To customize: Edit hero__headline, hero__subhead, hero__tagline, hero__body text.
  Hero background: Set --hero-image CSS variable on .hero to a url() or swap in a real <img>.
  The Missouri SVG outline is inline — edit city dot coordinates as needed.
-->

<!-- ===== Hero ===== -->
<section class="hero" aria-label="Missouri Commercial MLS — Market Intelligence">
  <!-- Background: swap src for a real aerial photo via CSS or inline background-image -->
  <div class="hero__bg" style="background-image: linear-gradient(135deg, #0a1a0a 0%, #1a2e1a 40%, #0d200d 100%);"></div>

  <div class="hero__content">
    <div class="container">
      <div class="hero__inner">

        <!-- Left: Headline text -->
        <div class="hero__text">
          <h1 class="hero__headline">Missouri<br>Commercial<br>MLS</h1>
          <p class="hero__subhead">Market Intelligence</p>
          <p class="hero__tagline">Built for CRE Professionals.</p>
          <p class="hero__body">Accurate data. Powerful tools. Limitless opportunities across the Show-Me State.</p>
        </div>

        <!-- Right: State callout + outline -->
        <div class="hero__callout">
          <div class="hero__state-badge">
            <span class="line1">One State.</span>
            <span class="line2">One Market.</span>
            <span class="line3">Limitless<br>Opportunities.</span>
          </div>

          <!-- Missouri outline SVG — simplified path, cities as dots -->
          <svg class="hero__state-outline" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Missouri state outline">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- Missouri outline (simplified) -->
            <path d="M 30 20 L 170 20 L 175 30 L 172 50 L 178 65 L 175 80 L 170 95 L 165 110 L 155 130 L 140 150 L 120 165 L 100 175 L 80 168 L 60 155 L 42 138 L 30 120 L 22 100 L 25 80 L 20 60 L 25 40 Z"
                  fill="none" stroke="#7ab648" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>
            <!-- Missouri River rough line -->
            <path d="M 30 65 Q 80 60 120 55 Q 150 52 175 65"
                  fill="none" stroke="#7ab648" stroke-width="0.5" opacity="0.4" stroke-dasharray="3 3"/>
            <!-- City dots -->
            <!-- Kansas City -->
            <circle class="dot" cx="45" cy="80" r="4" fill="#7ab648" filter="url(#glow)"/>
            <text x="50" y="84" font-size="7" fill="#9cd45a" font-family="Barlow Condensed, sans-serif" font-weight="700" letter-spacing="0.05em">KANSAS CITY</text>
            <!-- St. Louis -->
            <circle class="dot" cx="155" cy="100" r="4" fill="#7ab648" filter="url(#glow)"/>
            <text x="140" y="111" font-size="7" fill="#9cd45a" font-family="Barlow Condensed, sans-serif" font-weight="700" letter-spacing="0.05em">ST. LOUIS</text>
            <!-- Springfield -->
            <circle class="dot" cx="80" cy="145" r="3" fill="#7ab648" filter="url(#glow)"/>
            <text x="85" y="149" font-size="6" fill="#9aaa8a" font-family="Barlow Condensed, sans-serif" font-weight="700" letter-spacing="0.05em">SPRINGFIELD</text>
            <!-- Columbia -->
            <circle class="dot" cx="110" cy="90" r="3" fill="#7ab648" filter="url(#glow)"/>
            <text x="115" y="93" font-size="6" fill="#9aaa8a" font-family="Barlow Condensed, sans-serif" font-weight="700" letter-spacing="0.05em">COLUMBIA</text>
            <!-- St. Joseph -->
            <circle class="dot" cx="48" cy="48" r="3" fill="#7ab648" filter="url(#glow)"/>
            <text x="53" y="51" font-size="6" fill="#9aaa8a" font-family="Barlow Condensed, sans-serif" font-weight="700" letter-spacing="0.05em">ST. JOSEPH</text>
          </svg>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- ===== Search Bar ===== -->
<div class="search-bar" role="search">

  <!-- Tab switcher -->
  <div class="container">
    <div class="search-bar__tabs" role="tablist" aria-label="Search type">
      <button class="search-bar__tab search-bar__tab--active"
              role="tab" aria-selected="true" aria-controls="panel-property" id="tab-property"
              data-tab="property">Find a Property</button>
      <button class="search-bar__tab"
              role="tab" aria-selected="false" aria-controls="panel-member" id="tab-member"
              data-tab="member">Find a Member</button>
      <button class="search-bar__tab"
              role="tab" aria-selected="false" aria-controls="panel-company" id="tab-company"
              data-tab="company">Find a Company</button>
    </div>
  </div>

  <!-- Property Search Panel -->
  <div class="search-panel search-panel--active" id="panel-property" role="tabpanel" aria-labelledby="tab-property">
    <div class="search-bar__fields">
      <!-- Property Type -->
      <div class="search-bar__field">
        <label class="search-bar__label" for="prop-type">Property Type</label>
        <div class="search-bar__input-wrap">
          <select id="prop-type" name="propertyType">
            <option value="">All Types</option>
            <option value="industrial">Industrial</option>
            <option value="retail">Retail</option>
            <option value="office">Office</option>
            <option value="multifamily">Multifamily</option>
            <option value="land">Land</option>
            <option value="investment">Investment</option>
          </select>
          <svg class="search-bar__chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Location -->
      <div class="search-bar__field">
        <label class="search-bar__label" for="prop-location">Location</label>
        <div class="search-bar__input-wrap">
          <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <input type="text" id="prop-location" name="location" placeholder="City, County or ZIP">
        </div>
      </div>
      <!-- Min Cap Rate -->
      <div class="search-bar__field">
        <label class="search-bar__label" for="prop-cap-rate">Min Cap Rate</label>
        <div class="search-bar__input-wrap">
          <select id="prop-cap-rate" name="minCapRate">
            <option value="">Any</option>
            <option value="4">4%+</option>
            <option value="5">5%+</option>
            <option value="6">6%+</option>
            <option value="7">7%+</option>
            <option value="8">8%+</option>
          </select>
          <svg class="search-bar__chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Min/Max SF -->
      <div class="search-bar__field">
        <label class="search-bar__label" for="prop-sf-min">Min / Max SF</label>
        <div class="search-bar__input-wrap">
          <select id="prop-sf-min" name="minSF">
            <option value="">Any</option>
            <option value="1000">1,000 SF</option>
            <option value="5000">5,000 SF</option>
            <option value="10000">10,000 SF</option>
            <option value="50000">50,000 SF</option>
            <option value="100000">100,000 SF</option>
          </select>
          <span style="color:#ccc; font-size:12px;">—</span>
          <select name="maxSF">
            <option value="">Any</option>
            <option value="5000">5,000 SF</option>
            <option value="25000">25,000 SF</option>
            <option value="100000">100,000 SF</option>
            <option value="500000">500,000 SF</option>
            <option value="1000000">1M+ SF</option>
          </select>
          <svg class="search-bar__chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Submit -->
      <button class="search-bar__submit" type="button" onclick="handlePropertySearch()">
        Search Listings
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <div class="container search-bar__advanced">
      <a href="/listings/search/advanced">Advanced Search →</a>
    </div>
  </div>

  <!-- Member Search Panel -->
  <div class="search-panel" id="panel-member" role="tabpanel" aria-labelledby="tab-member">
    <div class="search-bar__fields" style="grid-template-columns: 1fr 1fr auto;">
      <div class="search-bar__field">
        <label class="search-bar__label" for="member-name">Member Name</label>
        <div class="search-bar__input-wrap">
          <input type="text" id="member-name" name="memberName" placeholder="First or last name">
        </div>
      </div>
      <div class="search-bar__field">
        <label class="search-bar__label" for="member-location">Location</label>
        <div class="search-bar__input-wrap">
          <input type="text" id="member-location" name="memberLocation" placeholder="City or ZIP">
        </div>
      </div>
      <button class="search-bar__submit" type="button" onclick="handleMemberSearch()">
        Find Members
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>

  <!-- Company Search Panel -->
  <div class="search-panel" id="panel-company" role="tabpanel" aria-labelledby="tab-company">
    <div class="search-bar__fields" style="grid-template-columns: 1fr 1fr auto;">
      <div class="search-bar__field">
        <label class="search-bar__label" for="company-name">Company Name</label>
        <div class="search-bar__input-wrap">
          <input type="text" id="company-name" name="companyName" placeholder="Brokerage or firm name">
        </div>
      </div>
      <div class="search-bar__field">
        <label class="search-bar__label" for="company-location">Location</label>
        <div class="search-bar__input-wrap">
          <input type="text" id="company-location" name="companyLocation" placeholder="City or ZIP">
        </div>
      </div>
      <button class="search-bar__submit" type="button" onclick="handleCompanySearch()">
        Find Companies
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>

</div>
